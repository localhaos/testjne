name: Build Frida Stealth Bypass

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a

    env:
      ANDROID_PLATFORM: android-21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android NDK
        run: |
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | sort | tail -n 1)

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

          echo "Using NDK:"
          echo "$NDK_PATH"

      - name: Verify environment
        run: |
          echo "PWD:"
          pwd

          echo ""
          echo "Repository:"
          ls -la

          echo ""
          echo "Source:"
          ls -la src

          echo ""
          echo "CMake:"
          cmake --version

      - name: Generate CMakeLists.txt
        run: |
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.10)

          project(stealth_fix)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          set(CMAKE_LIBRARY_OUTPUT_DIRECTORY
              ${CMAKE_BINARY_DIR}/libs/${ANDROID_ABI})

          add_library(
              stealth_fix
              SHARED
              src/stealth_fix.cpp
          )

          find_library(log-lib log)

          target_link_libraries(
              stealth_fix
              ${log-lib}
          )
          EOF

      - name: Configure CMake
        run: |
          cmake -B build \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${ANDROID_PLATFORM} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_STL=c++_shared

      - name: Build
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Verify output
        run: |
          find build -name "*.so"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stealth_fix-${{ matrix.abi }}
          path: build/libs/${{ matrix.abi }}/libstealth_fix.so
