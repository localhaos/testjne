name: Build Frida Stealth Bypass

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a

    env:
      ANDROID_PLATFORM: android-21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # PATCH SOURCE COMPATIBILITY
      # ------------------------------------------------------------

      - name: Patch source compatibility
        shell: bash
        run: |
          set -e

          FILE="stealth_fix.cpp"

          if [ ! -f "$FILE" ]; then
            echo "Missing source file: $FILE"
            exit 1
          fi

          echo "Applying compatibility patches..."

          # --------------------------------------------------------
          # Fix ashmem include
          # --------------------------------------------------------

          perl -0pi -e '
          s@#include <sys/ashmem\.h>@#if __has_include(<sys/ashmem.h>)\n#include <sys/ashmem.h>\n#endif@g
          ' "$FILE"

          # --------------------------------------------------------
          # Fix PAGE_SIZE redefine
          # --------------------------------------------------------

          perl -0pi -e '
          s@#define PAGE_SIZE sysconf\(_SC_PAGESIZE\)@#ifndef PAGE_SIZE\n#define PAGE_SIZE 4096\n#endif@g
          ' "$FILE"

          # --------------------------------------------------------
          # Fix AssetManager API names
          # --------------------------------------------------------

          sed -i 's/AAssetManager_getNextFileName/AAssetDir_getNextFileName/g' "$FILE"
          sed -i 's/AAssetManager_closeDir/AAssetDir_close/g' "$FILE"

          # --------------------------------------------------------
          # Fix dlopen invalid call
          # --------------------------------------------------------

          sed -i 's/dlopen(addr, RTLD_NOW | RTLD_GLOBAL)/nullptr/g' "$FILE"

          # --------------------------------------------------------
          # Disable dlinfo block
          # --------------------------------------------------------

          perl -0pi -e '
          s@struct link_map\* map;.*?wipe_elf_header\(reinterpret_cast<void\*>\(map->l_addr\)\);\s*}@@sg
          ' "$FILE"

          echo "Patch complete."

      # ------------------------------------------------------------
      # INSTALL NDK
      # ------------------------------------------------------------

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      # ------------------------------------------------------------
      # EXPORT NDK PATH
      # ------------------------------------------------------------

      - name: Export NDK path
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # VERIFY ENVIRONMENT
      # ------------------------------------------------------------

      - name: Verify environment
        shell: bash
        run: |
          set -e

          echo "PWD:"
          pwd

          echo ""
          echo "Repository:"
          ls -la

          echo ""
          echo "CMake:"
          cmake --version

          echo ""
          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

      # ------------------------------------------------------------
      # VERIFY SOURCE
      # ------------------------------------------------------------

      - name: Verify required source file
        shell: bash
        run: |
          set -e

          if [ ! -f stealth_fix.cpp ]; then
            echo "Missing file: stealth_fix.cpp"
            exit 1
          fi

      # ------------------------------------------------------------
      # GENERATE CMAKE
      # ------------------------------------------------------------

      - name: Generate CMakeLists.txt
        shell: bash
        run: |
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.10)

          project(stealth_fix)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          set(CMAKE_LIBRARY_OUTPUT_DIRECTORY
              ${CMAKE_BINARY_DIR}/libs/${ANDROID_ABI})

          add_library(
              stealth_fix
              SHARED
              stealth_fix.cpp
          )

          target_include_directories(
              stealth_fix
              PRIVATE
              include
          )

          find_library(log-lib log)
          find_library(android-lib android)

          target_link_libraries(
              stealth_fix
              ${log-lib}
              ${android-lib}
          )
          EOF

      # ------------------------------------------------------------
      # CONFIGURE
      # ------------------------------------------------------------

      - name: Configure CMake
        shell: bash
        run: |
          set -e

          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${ANDROID_PLATFORM} \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_shared

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Build
        shell: bash
        run: |
          set -e

          cmake --build build --parallel 4

      # ------------------------------------------------------------
      # VERIFY OUTPUTS
      # ------------------------------------------------------------

      - name: Verify outputs
        shell: bash
        run: |
          echo "Generated files:"
          find build -type f

      # ------------------------------------------------------------
      # UPLOAD
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stealth_fix-${{ matrix.abi }}
          path: build/libs/${{ matrix.abi }}/libstealth_fix.so
          if-no-files-found: error
